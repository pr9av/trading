name: flutter_dashboard
description: Production-grade trading dashboard for Blauplug Innovation.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  web_socket_channel: ^2.4.4
  intl: ^0.19.0
  fl_chart: ^0.66.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  candlesticks: ^2.1.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_generative_ai: ^0.4.3
  flutter_local_notifications: ^17.2.1
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.4
  uuid: ^4.5.3
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
