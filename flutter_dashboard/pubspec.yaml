name: flutter_dashboard
description: Production-grade trading dashboard for Blauplug Innovation.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  web_socket_channel: ^2.4.4
  intl: ^0.19.0
  fl_chart: ^0.66.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  candlesticks: ^2.1.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
