name: Blauplug Trading Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: blauplug_trading
          POSTGRES_USER: blauplug
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install API Gateway dependencies
      run: |
        cd services/api-gateway
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run API Gateway tests
      env:
        DATABASE_URL: postgresql://blauplug:test_password@localhost:5432/blauplug_trading
        REDIS_HOST: localhost
      run: |
        cd services/api-gateway
        pytest test_auth.py -v
    
    - name: Install Order Management dependencies
      run: |
        cd services/order-management
        pip install -r requirements.txt
        pip install pytest SQLAlchemy
    
    - name: Run Order Management tests
      env:
        DATABASE_URL: postgresql://blauplug:test_password@localhost:5432/blauplug_trading
      run: |
        cd services/order-management
        pytest test_orders.py -v
    
    - name: Install Trade Execution dependencies
      run: |
        cd services/trade-execution
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run Trade Execution tests
      env:
        REDIS_HOST: localhost
      run: |
        cd services/trade-execution
        pytest test_executor.py -v
    
    - name: Install AI Signal dependencies
      run: |
        cd services/ai-signal
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run linting (flake8)
      run: |
        pip install flake8
        flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build API Gateway image
      uses: docker/build-push-action@v4
      with:
        context: ./services/api-gateway
        push: false
        tags: blauplug/api-gateway:latest
    
    - name: Build Order Management image
      uses: docker/build-push-action@v4
      with:
        context: ./services/order-management
        push: false
        tags: blauplug/order-management:latest
    
    - name: Build Trade Execution image
      uses: docker/build-push-action@v4
      with:
        context: ./services/trade-execution
        push: false
        tags: blauplug/trade-execution:latest
    
    - name: Build Market Data image
      uses: docker/build-push-action@v4
      with:
        context: ./services/market-data
        push: false
        tags: blauplug/market-data:latest
    
    - name: Build AI Signal image
      uses: docker/build-push-action@v4
      with:
        context: ./services/ai-signal
        push: false
        tags: blauplug/ai-signal:latest

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
