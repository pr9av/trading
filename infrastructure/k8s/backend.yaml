apiVersion: v1
kind: Namespace
metadata:
  name: blauplug-trading

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: blauplug-trading
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  POSTGRES_HOST: "postgres"
  ACTIVE_BROKER: "simulated"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: blauplug-trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: blauplug/api-gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: trading-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: blauplug-trading
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
