version: '3.8'

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka Topic Initializer ──────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic market_ticks       --replication-factor 1 --partitions 4 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order_events       --replication-factor 1 --partitions 2 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trade_events       --replication-factor 1 --partitions 2 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic portfolio_updates  --replication-factor 1 --partitions 2 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ai_signals         --replication-factor 1 --partitions 2 &&
      echo 'All Kafka topics created successfully.'
      "
    restart: on-failure
    networks:
      - trading-net

  postgres:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Microservices ────────────────────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_URL=${REDIS_URL}
      - MARKET_DATA_URL=http://market-data:${MARKET_DATA_PORT}
      - ORDER_MGMT_URL=http://order-management:${ORDER_MANAGEMENT_PORT}
      - TRADE_EXEC_URL=http://trade-execution:${TRADE_EXECUTION_PORT}
      - AI_SIGNAL_URL=http://ai-signal:${AI_SIGNAL_PORT}
    networks:
      - trading-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  market-data:
    build: ./services/market-data
    ports:
      - "${MARKET_DATA_PORT:-8001}:${MARKET_DATA_PORT:-8001}"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ACTIVE_BROKER=${ACTIVE_BROKER}
    networks:
      - trading-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  order-management:
    build: ./services/order-management
    ports:
      - "${ORDER_MANAGEMENT_PORT:-8002}:${ORDER_MANAGEMENT_PORT:-8002}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  trade-execution:
    build: ./services/trade-execution
    ports:
      - "${TRADE_EXECUTION_PORT:-8003}:${TRADE_EXECUTION_PORT:-8003}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - trading-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai-signal:
    build: ./services/ai-signal
    ports:
      - "${AI_SIGNAL_PORT:-8004}:${AI_SIGNAL_PORT:-8004}"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - MODEL_PATH=${MODEL_PATH}
    networks:
      - trading-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - trading-net
    depends_on:
      prometheus:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────────────────────────
  flutter-dashboard:
    build:
      context: ./flutter_dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api-gateway
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
